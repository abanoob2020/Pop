# Alembic configuration for XCAMP Fitness OS (staging).
# The database URL is NOT stored here - it is resolved at runtime from
# environment variables in migrations/env.py (see app/config.py). This keeps
# credentials out of git.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# Use a zero-padded numeric prefix so the logical order (001..012) is obvious.
version_num_format = %%04d

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
